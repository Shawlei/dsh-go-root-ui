<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>dsh-go Root UI</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>dsh-go Root UI <span class="badge" id="mode">检测通道…</span></h1>
<div class="sub">给 proot 运行环境递 root；也可以当手机侧的 root shell 用。</div>

<section class="card">
  <h2>状态</h2>
  <dl class="grid">
    <dt>运行身份</dt><dd id="s-uid">—</dd>
    <dt>设备</dt><dd id="s-dev">—</dd>
    <dt>SELinux</dt><dd id="s-ctx">—</dd>
    <dt>容器客户端</dt><dd id="s-cli">—</dd>
  </dl>
</section>

<section class="card">
  <h2>命令（手机侧执行）</h2>
  <textarea id="cmd" spellcheck="false" autocapitalize="off" autocorrect="off">id</textarea>
  <div class="chips" id="chips"></div>
  <div class="btns">
    <button class="primary" id="run">运行</button>
    <button id="install">更新客户端</button>
    <button id="log">日志</button>
    <button id="rotate">换 token</button>
    <button id="copy">复制输出</button>
  </div>
  <pre id="out">点「运行」执行</pre>
</section>

<section class="card hide" id="tokbox">
  <h2>token</h2>
  <div class="sub">HTTP 模式下需要与 /data/adb/dshgo_rootui/token 一致</div>
  <input id="tok" spellcheck="false" autocapitalize="off" autocorrect="off">
</section>

<script>window.DSHGO = { token: "__TOKEN__" };</script>
<script src="app.js"></script>
</body>
</html>
