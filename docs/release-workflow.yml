# 这个文件因为 fine-grained PAT 缺 workflow 权限，先放在 docs/ 下。
# 想启用自动发布：在 GitHub 网页上新建 .github/workflows/release.yml，把下面内容贴进去即可。
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build module zip
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq zip
          ./build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: module-zip
          path: dist/*.zip

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
